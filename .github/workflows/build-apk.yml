name: Generar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Compilar APK instalable
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ALTO_NIVEL_CAR_SHOP_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
