
name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$MANAGER" ]; then
            mkdir -p "$SDK/cmdline-tools"

            curl -fL --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/android-tools.zip

            unzip -q /tmp/android-tools.zip -d /tmp/android-tools

            mv /tmp/android-tools/cmdline-tools \
              "$SDK/cmdline-tools/latest"
          fi

          "$MANAGER" --version

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK instalable
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: ALTO_NIVEL_CAR_SHOP_APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
